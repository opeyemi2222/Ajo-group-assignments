<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AJO Savings — Schedule your next AJO savings contribution.">

    <title>AJO Savings — Schedule Payment</title>

    <!-- Auth Guard -->
    <script>(function(){if(!localStorage.getItem("user"))window.location.replace("../login.html");})()</script>


    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->

    <link rel="stylesheet" href="./schedule.css">

</head>


<body>


    <!-- =================================
         PAGE WRAPPER
    ================================== -->

    <div class="schedule-page">


        <!-- =================================
             TOP NAVIGATION
        ================================== -->

        <header class="schedule-header">

            <a href="./user.html#schedule" class="back-button">

                <i class="bi bi-arrow-left"></i>

                Back to Payments

            </a>


            <div class="schedule-logo">

                <div class="logo-icon">

                    <i class="bi bi-piggy-bank-fill"></i>

                </div>

                <div>

                    <h4>
                        AJO Savings
                    </h4>

                    <span>
                        Build a Better Tomorrow
                    </span>

                </div>

            </div>

        </header>



        <!-- =================================
             MAIN CONTENT
        ================================== -->

        <main class="schedule-main">


            <!-- Page Heading -->

            <div class="schedule-heading">

                <span class="heading-icon">

                    <i class="bi bi-calendar-plus"></i>

                </span>

                <div>

                    <h1>
                        Schedule a Payment
                    </h1>

                    <p>
                        Set up your next AJO savings contribution.
                    </p>

                </div>

            </div>



            <!-- =================================
                 PAYMENT LAYOUT
            ================================== -->

            <div class="schedule-layout">


                <!-- =================================
                     PAYMENT FORM
                ================================== -->

                <div class="schedule-card">

                    <form id="schedulePaymentForm">


                        <!-- Payment Amount -->

                        <div class="form-section">

                            <label for="paymentAmount">

                                Payment Amount

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    ₦
                                </span>

                                <input type="number" class="form-control" id="paymentAmount" placeholder="5,000"
                                    min="100" required>

                            </div>

                        </div>



                        <!-- Payment Frequency -->

                        <div class="form-section">

                            <label for="paymentFrequency">

                                Payment Month

                            </label>

                            <select class="form-select" id="paymentFrequency" required>

                                <option value="">
                                    Select Month
                                </option>

                                <option value="January">
                                    January </option>

                                <option value="February">
                                    February
                                </option>

                                <option value="March">
                                    March
                                </option>

                                <option value="April">
                                    April
                                </option>

                                <option value="May">
                                    May
                                </option>

                                <option value="June">
                                    June
                                </option>

                                <option value="July">
                                    July
                                </option>

                                <option value="August">
                                    August
                                </option>

                                <option value="September">
                                    September
                                </option>

                                <option value="October">
                                    October
                                </option>

                                <option value="November">
                                    November
                                </option>

                                <option value="December">
                                    December
                                </option>

                            </select>

                        </div>



                        <!-- Payment Date -->

                        <div class="form-section">

                            <label for="paymentDate">

                                First Payment Date

                            </label>

                            <div class="input-icon">

                                <i class="bi bi-calendar3"></i>

                                <input type="date" class="form-control" id="paymentDate" required>

                            </div>

                        </div>



                        <!-- Payment Note -->

                        <div class="form-section">

                            <label for="paymentNote">

                                Payment Note
                                <span>
                                    Optional
                                </span>

                            </label>

                            <textarea class="form-control" id="paymentNote" rows="4"
                                placeholder="Add a note about this payment...">
                            </textarea>

                        </div>



                        <!-- Confirmation -->

                        <div class="form-check confirmation-check">

                            <input class="form-check-input" type="checkbox" id="paymentConfirmation" required>

                            <label class="form-check-label" for="paymentConfirmation">

                                I confirm that the payment details
                                provided are correct.

                            </label>

                        </div>



                        <!-- Submit -->
                        <button type="submit" class="schedule-submit-btn">

                            <i class="bi bi-calendar-check"></i>

                            Review Payment

                        </button>


                    </form>

                </div>

                <!-- ===============================================
 ALERT MESAAGE
=====================================================-->


                <div id="successAlert" class="alert alert-success alert-dismissible fade d-none" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span id="successAlertMessage"></span>

                    <button type="button" class="btn-close" onclick="hideSuccessAlert()"></button>
                </div>

                <!-- =================================
     PAYMENT SUMMARY
================================== -->

                <div class="payment-summary">

                    <div class="summary-card">

                        <div class="summary-header">

                            <i class="bi bi-receipt"></i>

                            <h4>
                                Payment Summary
                            </h4>

                        </div>


                        <!-- Amount -->

                        <div class="summary-item">

                            <span>
                                Amount
                            </span>

                            <strong id="summaryAmount">
                                ₦0
                            </strong>

                        </div>


                        <!-- Frequency -->

                        <div class="summary-item">

                            <span>
                                Frequency
                            </span>

                            <strong id="summaryFrequency">
                                Not selected
                            </strong>

                        </div>


                        <!-- First Payment -->

                        <div class="summary-item">

                            <span>
                                First Payment
                            </span>

                            <strong id="summaryDate">
                                Not selected
                            </strong>

                        </div>


                        <!-- Payment Note -->

                        <div class="summary-item">

                            <span>
                                Note
                            </span>

                            <strong id="summaryNote">
                                No note
                            </strong>

                        </div>


                        <!-- Confirm Button -->

                        <button type="button" class="confirm-payment-btn" id="confirmPaymentBtn">

                            <i class="bi bi-check-circle-fill"></i>

                            Confirm & Schedule Payment

                        </button>


                    </div>


                    <!-- Security Notice -->

                    <div class="security-card">

                        <i class="bi bi-shield-check"></i>

                        <div>

                            <strong>
                                Secure Payments
                            </strong>

                            <p>
                                Your payment information is
                                protected and securely handled.
                            </p>

                        </div>

                    </div>

                </div>


            </div>

        </main>

    </div>



    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="./schedule.js"></script>

    <!-- =========================================
         TOAST NOTIFICATION
    ========================================== -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index:9999;">
        <div id="appToast" class="toast align-items-center border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" id="appToastBody">
                    <i class="bi" id="appToastIcon"></i>
                    <span id="appToastMessage"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

</body>

</html>
