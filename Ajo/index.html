<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AJO Savings Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/auth.css">

    <script src="./js/auth.js" defer></script>

</head>

<body>

<div class="container-fluid auth-page">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-xl-11">

            <div class="row auth-card">

                <!-- LEFT SIDE -->

                <div class="col-lg-4 welcome-side">

                    <div>

                        <h1>AJO SAVE</h1>

                        <p>

                            Professional Ajo Savings & Contribution Management System.

                        </p>

                        <hr>

                        <div class="feature">

                            <i class="fa-solid fa-users"></i>

                            Member Management

                        </div>

                        <div class="feature">

                            <i class="fa-solid fa-piggy-bank"></i>

                            Savings Tracking

                        </div>

                        <div class="feature">

                            <i class="fa-solid fa-wallet"></i>

                            Payment Processing

                        </div>

                        <div class="feature">

                            <i class="fa-solid fa-chart-column"></i>

                            Reports & Analytics

                        </div>

                    </div>

                </div>

                <!-- LOGIN -->

                <div class="col-lg-8 login-side">

                    <h3 class="mb-4">

                        Login

                    </h3>

                    <form id="loginForm">

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                type="email"
                                class="form-control"
                                id="loginEmail"
                                required>

                        </div>

                        <div class="mb-4">

                            <label>Password</label>

                            <div class="password-box">

                                <input
                                    type="password"
                                    class="form-control"
                                    id="loginPassword"
                                    required>

                                <i class="fa-solid fa-eye togglePassword"></i>

                            </div>

                        </div>

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox">

                            <label class="form-check-label">

                                Remember Me

                            </label>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Login

                        </button>

                        <p class="auth-switch text-center mt-4 mb-0">

                            New to AJO SAVE? <a href="register.html">Create an account</a>

                        </p>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
